name: Pulse of Growth (Garden Care)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  awaken:
    runs-on: ubuntu-latest
    steps:
      - name: "🧘 Pulse: Roots (Voice)"
        run: |
          curl -s "https://badseed.exposed/.netlify/functions/heartbeat-get" > /dev/null

      - name: "🌱 Pulse: Stalk (Value)"
        run: |
          curl -s "https://token.badseed.exposed/.netlify/functions/summary" > /dev/null

      - name: "🌸 Pulse: Bloom (Agent)"
        run: |
          curl -s -X POST "https://agent.badseed.exposed/.netlify/functions/grok-chat" \
          -H "Content-Type: application/json" \
          -d '{"ping":true}' > /dev/null
